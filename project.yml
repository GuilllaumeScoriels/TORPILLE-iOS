name: TorpilleIOS
options:
  bundleIdPrefix: com.torpille
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.torpille.ios
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.10'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.10.0
targets:
  TorpilleIOS:
    type: application
    platform: iOS
    sources:
      - path: TorpilleIOS
    resources:
      - path: TorpilleIOS/Resources
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TorpilleIOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TorpilleIOS/TorpilleIOS.entitlements
        COPY_PHASE_STRIP: NO
        STRIP_INSTALLED_PRODUCT: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        PRODUCT_NAME: TorpilleIOS
        MARKETING_VERSION: '1.0.7'
        CURRENT_PROJECT_VERSION: 13
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_LSApplicationQueriesSchemes:
          - https
          - torpille
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Torpille utilise ta position uniquement après confirmation d’un pointage manuel pour l’afficher aux membres de tes communautés sur la carte pendant 30 minutes. Aucun pointage automatique. Tu peux refuser ou retirer ta position à tout moment.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Torpille accède aux photos et vidéos que tu sélectionnes afin de définir ta photo de profil ou de partager un média dans une communauté. Par exemple, une vidéo sélectionnée sera téléversée et visible par les membres de cette communauté.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Torpille utilise le microphone lorsque tu enregistres un message vocal ou une vidéo avec du son. Par exemple, cet enregistrement peut être envoyé dans une communauté et écouté par ses membres.
        INFOPLIST_KEY_NSContactsUsageDescription: Torpille utilise les numéros des contacts autorisés pour retrouver les comptes visibles, sans envoyer leurs noms ni conserver le carnet sur le serveur.
        INFOPLIST_KEY_NSCameraUsageDescription: Torpille utilise la caméra lorsque tu choisis de prendre une photo ou de filmer une vidéo. Par exemple, le média capturé peut être envoyé dans une communauté et sera alors visible par ses membres.
        INFOPLIST_KEY_FirebaseAppDelegateProxyEnabled: NO
        INFOPLIST_KEY_UIBackgroundModes:
          - remote-notification
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.torpille.deeplink
            CFBundleURLSchemes:
              - torpille
              - app-1-673304647046-ios-a5b17b3d65b29d3b9c8807
              - com.googleusercontent.apps.673304647046-najuofl5vsns5qbe9cdr0lt4ihlnlgtt
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck
  TorpilleIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TorpilleIOSTests
    dependencies:
      - target: TorpilleIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
